---
# Single deploy config for the kpn-pm app, shared by production and staging.
# The target is chosen by the repository folder it runs in, so this file is
# IDENTICAL on every branch — no per-environment edits, no merge conflicts.
#
#   repo folder kpn-pm        -> PRODUCTION  (branch: main)
#   repo folder kpn-pm_stage  -> STAGING     (branch: development)
#
# Do NOT edit this file on the server. Change it locally, commit, push, deploy.

deployment:
  tasks:
    - |
      set -e
      REPO="$(basename "$(pwd)")"
      case "$REPO" in
        kpn-pm)                             # PRODUCTION
          DEPLOYPATH=/home/hcispanel/kpn-pm
          PUBHTML=/home/hcispanel/public_html/kpncorporation.hcis.live
          ;;
        kpn-pm_stage)                       # STAGING
          DEPLOYPATH=/home/hcispanel/kpn-pm_stage
          PUBHTML=/home/hcispanel/public_html/kpncorporation-stage.hcis.live
          ;;
        *)
          echo "Unknown repo folder: $REPO — refusing to deploy"; exit 1
          ;;
      esac
      echo "Deploying $REPO -> $DEPLOYPATH  (assets: $PUBHTML)"

      # Copy application code into the live app directory
      cp -r app bootstrap config database routes resources "$DEPLOYPATH"/
      cp -r public/build "$DEPLOYPATH"/public/

      # Copy public assets into the site document root
      cp -r public/css public/img public/images public/js public/scss "$PUBHTML"/

      # Refresh Laravel caches in the live app
      cd "$DEPLOYPATH"
      php artisan view:clear
      php artisan optimize:clear
